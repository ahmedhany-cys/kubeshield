name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: python -m pytest --cov=kubeshield --cov-report=term-missing
      - name: Dependency audit
        run: pip-audit --skip-editable

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint Helm charts
        run: |
          helm lint deploy/helm/kubeshield
          helm lint deploy/helm/kubeshield-policies
      - name: Validate Falco rules with Falco 0.45.2
        run: |
          docker run --rm -v "$PWD/deploy/falco:/rules:ro" falcosecurity/falco:0.45.2 \
            falco -V /etc/falco/falco_rules.yaml -V /rules/kubeshield_rules.yaml
      - name: Trivy configuration scan (Helm charts, manifests, Dockerfile)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          skip-dirs: deploy/lab
          exit-code: "1"

  image:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t kubeshield:ci .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: kubeshield:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
