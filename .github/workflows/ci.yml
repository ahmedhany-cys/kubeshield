name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Third-party actions are pinned to commit SHAs. Trivy runs from its pinned container image, the same
# version KubeShield ships (0.76.1).
env:
  TRIVY_IMAGE: aquasec/trivy:0.76.1

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: python -m pytest --cov=kubeshield --cov-report=term-missing
      - name: Dependency audit
        run: pip-audit --skip-editable

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high

  manifests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - name: Lint Helm charts
        run: |
          helm lint deploy/helm/kubeshield
          helm lint deploy/helm/kubeshield-policies
      - name: Validate Falco rules with Falco 0.45.2
        run: |
          docker run --rm -v "$PWD/deploy/falco:/rules:ro" falcosecurity/falco:0.45.2 \
            falco -V /etc/falco/falco_rules.yaml -V /rules/kubeshield_rules.yaml
      - name: Trivy configuration scan (Helm charts, manifests, Dockerfile)
        # deploy/lab is deliberately insecure (it is the attack target). Accepted findings, each with a
        # reason, are in .trivyignore.yaml.
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src "$TRIVY_IMAGE" config --quiet \
            --severity CRITICAL,HIGH --skip-dirs deploy/lab --ignorefile .trivyignore.yaml --exit-code 1 .

  image:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build -t kubeshield:ci .
      - name: Trivy image scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image --quiet \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 kubeshield:ci
