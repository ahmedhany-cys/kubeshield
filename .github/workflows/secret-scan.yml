name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  trivy-secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy secret scan
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src aquasec/trivy:0.76.1 fs --quiet --scanners secret \
            --exit-code 1 .
