apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeshield-api
  namespace: {{ .Release.Namespace }}
  labels: {{- include "ks.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/component: api}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: api
        {{- include "ks.labels" . | nindent 8 }}
    spec:
      serviceAccountName: kubeshield
      securityContext:
        {{- include "ks.podSecurity" . | nindent 8 }}
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: postgres-password}}
            - name: KUBESHIELD_DATABASE_URL
              value: "postgresql+psycopg://kubeshield@kubeshield-postgres:5432/kubeshield"
            - name: KUBESHIELD_JWT_SECRET
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: jwt-secret}}
            - name: KUBESHIELD_INGEST_TOKEN
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: ingest-token}}
            - name: KUBESHIELD_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: admin-password}}
            - {name: KUBESHIELD_KUBE_MODE, value: in-cluster}
            - {name: KUBESHIELD_COOKIE_SECURE, value: {{ .Values.api.cookieSecure | quote }}}
            - {name: KUBESHIELD_PREFLIGHT_NAMESPACE, value: {{ .Values.preflightNamespace | quote }}}
            {{- range $k, $v := .Values.api.env }}
            - {name: {{ $k }}, value: {{ $v | quote }}}
            {{- end }}
          ports:
            - {name: http, containerPort: 8000}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- include "ks.containerSecurity" . | nindent 12 }}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: trivy-cache, mountPath: /var/cache/trivy}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: {{ .Values.api.tmpSizeLimit }}}
        - name: trivy-cache
          emptyDir: {sizeLimit: {{ .Values.api.trivyCacheSizeLimit }}}
---
# In-cluster endpoint used by Falcosidekick for ingestion.
apiVersion: v1
kind: Service
metadata:
  name: kubeshield-api
  namespace: {{ .Release.Namespace }}
  labels: {{- include "ks.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/component: api}
  ports:
    - {name: http, port: 8000, targetPort: http}
---
# Dashboard access for the local lab (kind maps the NodePort to 127.0.0.1 only).
apiVersion: v1
kind: Service
metadata:
  name: kubeshield-ui
  namespace: {{ .Release.Namespace }}
  labels: {{- include "ks.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector: {app.kubernetes.io/component: api}
  ports:
    - {name: http, port: 8000, targetPort: http, nodePort: {{ .Values.api.nodePort }}}
