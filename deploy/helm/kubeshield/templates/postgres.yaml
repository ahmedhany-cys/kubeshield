apiVersion: v1
kind: Service
metadata:
  name: kubeshield-postgres
  namespace: {{ .Release.Namespace }}
  labels: {{- include "ks.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/component: postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: 5432}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kubeshield-postgres
  namespace: {{ .Release.Namespace }}
  labels: {{- include "ks.labels" . | nindent 4 }}
spec:
  serviceName: kubeshield-postgres
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/component: postgres}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: postgres
        {{- include "ks.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "ks.podSecurity" . | nindent 8 }}
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - {name: POSTGRES_USER, value: kubeshield}
            - {name: POSTGRES_DB, value: kubeshield}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: postgres-password}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - {name: POSTGRES_INITDB_ARGS, value: "--auth-host=scram-sha-256"}
          ports:
            - containerPort: 5432
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext:
            {{- include "ks.containerSecurity" . | nindent 12 }}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "kubeshield", "-d", "kubeshield"]}
            periodSeconds: 10
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
